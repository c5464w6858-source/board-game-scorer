<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>IncludeMe — SEND Activity Finder</title>
    <meta name="description" content="Find inclusive, accessible activities, therapies and charities for children with special educational needs and disabilities across the UK." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F6B5C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IncludeMe" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Leaflet (map) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then(r => console.log("SW registered", r.scope))
            .catch(e => console.log("SW failed", e));
        });
      }
    </script>
    <script>
      /* Newest-version check: an installed copy can stay asleep on an old page. Compare the running bundle with the live one. */
      (function () {
        var last = 0;
        function mine() { var s = document.querySelector('script[type="module"][src*="assets/index-"]'); return s ? s.getAttribute("src") : ""; }
        function bar() {
          if (document.getElementById("updBar")) return;
          var d = document.createElement("div"); d.id = "updBar"; d.setAttribute("role", "status");
          d.style.cssText = "position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:99999;display:flex;gap:12px;align-items:center;justify-content:space-between;background:#0F3D36;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;font:600 14.5px system-ui,sans-serif;box-shadow:0 16px 30px -12px rgba(0,0,0,.5)";
          d.innerHTML = '<span>A newer version of IncludeMe is ready.</span><button type="button" style="background:#fff;color:#0F3D36;border:0;border-radius:9px;padding:9px 14px;font:700 14px system-ui,sans-serif">Update now</button>';
          d.querySelector("button").onclick = window.includeMeUpdate; document.body.appendChild(d);
        }
        window.includeMeUpdate = function () {
          var go = function () { location.reload(); };
          var c = "caches" in window ? caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }) : Promise.resolve();
          var u = "serviceWorker" in navigator ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : Promise.resolve();
          Promise.all([c, u]).then(go, go);
        };
        function check() {
          if (Date.now() - last < 30000 || !navigator.onLine) return; last = Date.now();
          var cur = mine(); if (!cur) return;
          try { if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }); } catch (e) {}
          fetch("/?_v=" + Date.now(), { cache: "no-store", headers: { accept: "text/html" } }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
            var m = /<script[^>]+src="([^"]*assets\/index-[^"]+\.js)"/.exec(t);
            if (!m || m[1] === cur) return;
            var tried = ""; try { tried = sessionStorage.getItem("includeme.updtried") || ""; } catch (e) {}
            var a = document.activeElement, busy = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
            if (!busy && tried !== m[1]) { try { sessionStorage.setItem("includeme.updtried", m[1]); } catch (e) {} window.includeMeUpdate(); }
            else bar();
          }).catch(function () {});
        }
        document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
        window.addEventListener("pageshow", check);
        setTimeout(check, 2000);
      })();
    </script>
    <script src="./visit.js" defer></script>
</body>
</html>
