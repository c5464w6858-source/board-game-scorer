[build]
  command = "sh scripts/prepare-functions.sh && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Pretty path: /api/place-photo -> the function
[[redirects]]
  from = "/api/place-photo"
  to = "/.netlify/functions/place-photo"
  status = 200

# SPA fallback so client-side routing / OAuth redirects land on the app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always revalidate the page and service worker so a new release is picked up
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
